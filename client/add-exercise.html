<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>добавить упражениния</title>
        <script src="validation.js"></script>
        <script src="main.js"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <script>
            const loadMuscleGroups = async () => {
                try {
                    const token = sessionStorage.getItem("token");
                    const muscleGroups = await fetch("/api/muscle-groups", {
                        headers: {
                            authorization: token,
                            "content-type": "application/json",
                        },
                    }).then((d) => d.json());
                    return muscleGroups;
                } catch (error) {
                    console.warn(error);
                    return [];
                }
            };
            let mainGroup = [];
            const setMainGroup = (value) => {
                mainGroup = value;
                const $label = document.getElementById("main-group-label");
                if (!$label) return;
                $label.innerHTML = "";
                $label.insertAdjacentHTML("afterbegin", value.length > 0 ? "Выбранная группа: " + value.join(",") : "");
            };
            const renderGroups = (groups) => {
                const $list = document.getElementById("group-list");
                const getTemplate = (id, name) => `<li class="item">
        <label>
          <input class="form-check-input mx-2" name="main-group" type="radio" value="${id}" />
          <span>${name}</span>
        </label>
      </li>`;
                $list.innerHTML = "";
                groups.forEach((exercise) => {
                    $list.insertAdjacentHTML("beforeend", getTemplate(exercise.id, exercise.name));
                });
            };

            const renderSecondaryGroups = (groups) => {
                const $list = document.getElementById("group-add-list");
                const getTemplate = (id, name) => `<li class="item">
        <label class="d-flex align-items-center">
          <input class="form-check-input mx-2" name="subgroup" type="checkbox" value="${id}" />
          <span>${name}</span>
          <input style="width:50px" type="number" class="form-control form-control-sm mx-2" name="" min="1" max="3" value="1">
        </label>
      </li>`;
                $list.innerHTML = "";
                groups.forEach((exercise) => {
                    $list.insertAdjacentHTML("beforeend", getTemplate(exercise.id, exercise.name));
                });
            };

            const createSubmit = () => {
                const $form = document.getElementById("form");

                $form.addEventListener("submit", (e) => {
                    e.preventDefault();

                    const data = new FormData($form);
                    apiRequest("/api/exercises", {
                        method: "POST",
                        body: data,
                        token: true,
                    })
                        .onSuccess((data) => {
                            showResponse('Упражнение создано ID: ' + data.id)
                            $form.reset();
                        })
                        .onError(() => {})
                        .run();
                });
            };

            const setupImagePreview = () => {
                const $input = document.getElementById("image");
                const $wrap = document.getElementById("image-preview-wrap");
                const $img = document.getElementById("image-preview");
                let currentUrl = null;

                $input.addEventListener("change", () => {
                    if (currentUrl) URL.revokeObjectURL(currentUrl);
                    currentUrl = null;
                    $wrap.style.display = "none";
                    $img.removeAttribute("src");

                    const file = $input.files?.[0];
                    if (file && file.type.startsWith("image/")) {
                        currentUrl = URL.createObjectURL(file);
                        $img.src = currentUrl;
                        $wrap.style.display = "block";
                    }
                });
            };

            const main = async () => {
                const groups = await loadMuscleGroups();
                renderGroups(groups);
                renderSecondaryGroups(groups);
                createSubmit();
                setupImagePreview();
            };

            document.addEventListener("DOMContentLoaded", main);
        </script>
    </head>

    <body>
        <style>
            .list {
                height: 300px;
                overflow: auto;
                margin: 0;
                padding: 0;
            }

            .item {
                list-style: none;
                padding: 0;
                margin: 0;
                cursor: pointer;
                border-radius: 10px;
            }

            .item:hover {
                background-color: #e6e6e6;
            }

            .item label {
                cursor: pointer;
                width: 100%;
                padding: 4px;
            }
        </style>

        <div class="container pt-5">
            <form id="form" class="gap-3">
                <div class="row mb-2">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name">Название упражнения</label>
                            <input type="text" class="form-control" name="name" id="name" placeholder="Шраги со штангой" />
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-6 mb-2">
                        <div class="form-group">
                            <label>Основная группа мышц</label>
                            <ul class="list" id="group-list"></ul>
                        </div>
                    </div>

                    <div class="col-lg-6 mb-2">
                        <div class="form-group">
                            <label>Дополнительные группы мышц</label>
                            <ul class="list" id="group-add-list"></ul>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="image">Картинка упражнения</label>
                            <input class="form-control" type="file" accept="image/png, image/jpeg" name="image" id="image" />
                            <div id="image-preview-wrap" class="mt-2" style="display: none">
                                <img id="image-preview" alt="Превью" class="img-thumbnail" style="max-height: 200px" />
                            </div>
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary">отправить</button>
            </form>
        </div>
    </body>
</html>

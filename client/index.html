<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Админ панель</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <script>
            const checkToken = async (token) => {
                try {
                    const res = await fetch("/api/check-token", {
                        method: "post",
                        body: JSON.stringify({ token }),
                    }).then((d) => d.json());

                    return res?.isValid;
                } catch (error) {
                    console.warn(error);
                    return false;
                }
            };

            document.addEventListener("DOMContentLoaded", async () => {
                const sToken = sessionStorage.getItem("token");

                if (sToken) {
                    const isValid = await checkToken(sToken);
                    if (isValid) {
                        window.location.href = "/admin/exercises.html";
                        return;
                    }
                }

                const $form = document.getElementById("form");

                $form.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const $login = document.getElementById("login");
                    const token = $login?.value;
                    if (!token) {
                        return;
                    }
                    const isValid = await checkToken(token);
                    if (!isValid) {
                        return;
                    }
                    sessionStorage.setItem("token", token);
                    window.location.href = "/admin/exercises.html";
                });
            });
        </script>
    </head>

    <body>
        <main>
            <div class="container">
                <div class="mb-3">
                    <form id="form">
                        <input id="login" type="login" class="form-control" placeholder="токен пользователя" />
                        <button type="submit" class="btn btn-primary mb-3">войти</button>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
